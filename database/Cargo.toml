[package]
name = "database"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
migration = { path = "../migration" }
sea-orm = { version = "1.1.7", features = ["sqlx-sqlite", "runtime-tokio", "macros", "chrono"] }
serde_json = "1.0.111"
serde = { version = "1.0.195", features = ["derive"] }
tracing = "0.1.40"
ts-rs = { version = "10.1.0", features = ["chrono-impl", "no-serde-warnings"] }
regex = "1.10.3"

[build-dependencies]
regex = "1.10.3"
sea-orm = { version = "1.1.7", features = ["sqlx-sqlite", "runtime-tokio", "macros", "chrono"] }
serde_json = "1.0.111"
serde = { version = "1.0.195", features = ["derive"] }
ts-rs = { version = "10.1.0", features = ["chrono-impl", "no-serde-warnings"] }
