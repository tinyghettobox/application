# .cargo/config.toml  (in /project/application)
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = [
    "-C", "link-arg=--sysroot=/tmp/aarch64",
    "-C", "link-arg=-Wl,-rpath-link,/tmp/aarch64/lib/aarch64-linux-gnu",
    "-C", "link-arg=-Wl,-rpath-link,/tmp/aarch64/usr/lib/aarch64-linux-gnu",
    # (optional, makes the interpreter explicit)
    "-C", "link-arg=-Wl,--dynamic-linker=/lib/ld-linux-aarch64.so.1",
]

[env]
DEP_LV_CONFIG_PATH = { value = "./user_interface_lvgl/include", relative = true, force = true }
LIB = "P:\\msys2\\mingw64\\lib;${LIB}"
INCLUDE = "P:\\msys2\\mingw64\\include;${INCLUDE}"